<!DOCTYPE html><p><h1>Primality Tester Lite</h1><input id=N><button onclick="n=performance.now();R.innerText=N.value?(1n<<64n)<=BigInt(N.value)?'OverFlow.':N.value+` is ${p(BigInt(N.value))?'':'not '}prime.`:'';T.innerText=`(${performance.now()-n}ms)`">Test</button><p id=R><p id=T><script>p=n=>{if(n<2n)return!1;let a=[2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n],d=n-1n,s=0n;if(a.includes(n))return!0;if(!a.some(x=>n%x))return!1;while(~d&1n)d>>=1n,s++;for(b of a){if(b>=n)break;let x=m(b,d,n);if(x!==1n&&x!==n-1n){let f=!1;for(let r=1n;r<s;r++){x=x*x%n;if(x===n-1n){f=!0;break}}if(!f)return!1}}return!0},m=(b,e,m)=>{let r=1n;for(b%=m;e>0n;e>>=1n){if(e&1n)r=r*b%m;b=b*b%m}return r}</script>
