<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>表形式データ変換ツール</title>
<meta name="description" content="JS の二次元配列・CSV・Markdown 表・TeX tabular を相互に変換するブラウザ完結のツールです。">

<meta name="twitter:card" content="summary">

<meta name="twitter:description" content="JS の二次元配列・CSV・Markdown 表・TeX tabular を相互に変換するブラウザ完結のツールです。">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f6f7f9;
  --surface: #ffffff;
  --text: #1d2129;
  --muted: #6b7280;
  --border: #d7dbe2;
  --accent: #2563eb;
  --err: #b91c1c;
  --ok: #15803d;
  --head: rgba(37, 99, 235, 0.08);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK JP", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c;
    --surface: #1f2228;
    --text: #e6e8ec;
    --muted: #9aa1ac;
    --border: #3a3f48;
    --accent: #60a5fa;
    --err: #f87171;
    --ok: #4ade80;
    --head: rgba(96, 165, 250, 0.15);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c;
  --surface: #1f2228;
  --text: #e6e8ec;
  --muted: #9aa1ac;
  --border: #3a3f48;
  --accent: #60a5fa;
  --err: #f87171;
  --ok: #4ade80;
  --head: rgba(96, 165, 250, 0.15);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  padding: 0 16px;
}
main { max-width: 1100px; margin: 0 auto; padding: 20px 0 40px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 24px 0 8px; }
.lead { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.options {
  display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px;
}
.options label { display: inline-flex; gap: 6px; align-items: center; }
.panes {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch;
}
.pane {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; display: flex; flex-direction: column; min-width: 0;
}
.pane-head {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 8px; border-bottom: 1px solid var(--border);
}
.pane-head .spacer { flex: 1; }
textarea {
  flex: 1; width: 100%; min-height: 320px; border: 0; background: transparent;
  color: var(--text); font-family: var(--mono); font-size: 14px; line-height: 1.5;
  padding: 10px; resize: vertical; outline: none; white-space: pre;
}
textarea[readonly] { color: var(--text); }
.mid { display: flex; align-items: center; justify-content: center; }
select, button {
  font: inherit; font-size: 14px; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
button:hover, select:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.status { min-height: 1.4em; margin: 10px 2px; font-size: 14px; color: var(--muted); }
.status.ok { color: var(--ok); }
.status.err { color: var(--err); }
.preview {
  overflow: auto; max-height: 420px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--surface);
}
.preview:empty { display: none; }
table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
th, td {
  border: 1px solid var(--border); padding: 6px 10px; text-align: left;
  white-space: pre-wrap; vertical-align: top;
}
th { background: var(--head); font-weight: 600; }
@media (max-width: 760px) {
  .panes { grid-template-columns: 1fr; }
  .mid button { transform: rotate(90deg); }
}
</style>
</head>
<body>
<main>
  <h1>表形式データ変換ツール</h1>
  <p class="lead">JS の二次元配列・CSV・Markdown 表・TeX tabular を相互に変換します。入力すると自動で変換されます。</p>

  <div class="options">
    <label>CSV 区切り
      <select id="csvDelim">
        <option value="auto">自動判定</option>
        <option value="comma">カンマ ,</option>
        <option value="tab">タブ</option>
        <option value="semi">セミコロン ;</option>
      </select>
    </label>
    <label>JS 数値を数値で出力 <input type="checkbox" id="jsNumeric"></label>
    <label>TeX 列揃え
      <select id="texAlign">
        <option value="l">l（左）</option>
        <option value="c">c（中央）</option>
        <option value="r">r（右）</option>
      </select>
    </label>
    <label><input type="checkbox" id="texVRule" checked> TeX 縦線</label>
    <label><input type="checkbox" id="texHRule" checked> TeX 全行に横線</label>
  </div>

  <div class="panes">
    <section class="pane">
      <div class="pane-head">
        <select id="inFmt" aria-label="入力形式">
          <option value="js">JS 二次元配列</option>
          <option value="csv">CSV</option>
          <option value="md">Markdown 表</option>
          <option value="tex">TeX (tabular)</option>
        </select>
        <span class="spacer"></span>
        <button id="sampleBtn" type="button">サンプル</button>
        <button id="clearBtn" type="button">クリア</button>
      </div>
      <textarea id="input" spellcheck="false" aria-label="入力"></textarea>
    </section>

    <div class="mid">
      <button id="swapBtn" type="button" title="入出力を入れ替え" aria-label="入出力を入れ替え">⇄</button>
    </div>

    <section class="pane">
      <div class="pane-head">
        <select id="outFmt" aria-label="出力形式">
          <option value="js">JS 二次元配列</option>
          <option value="csv">CSV</option>
          <option value="md" selected>Markdown 表</option>
          <option value="tex">TeX (tabular)</option>
        </select>
        <span class="spacer"></span>
        <button id="copyBtn" type="button">コピー</button>
      </div>
      <textarea id="output" readonly aria-label="出力"></textarea>
    </section>
  </div>

  <div id="status" class="status" role="status"></div>

  <h2>プレビュー（入力を解釈した結果）</h2>
  <div id="preview" class="preview"></div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const inFmt = $('inFmt'), outFmt = $('outFmt');
  const inputEl = $('input'), outputEl = $('output');
  const statusEl = $('status'), previewEl = $('preview');

  const DELIMS = { comma: ',', tab: '\t', semi: ';' };

  /* ---------- 共通ユーティリティ ---------- */
  const width = rows => rows.reduce((m, r) => Math.max(m, r.length), 0);
  const pad = (rows, w) => rows.map(r => [...r, ...Array(w - r.length).fill('')]);
  const cellToStr = v => (v === null || v === undefined ? '' : String(v));
  const countOf = (s, ch) => s.split(ch).length - 1;

  /* ---------- JS 二次元配列 : 読み込み（eval を使わない制限付きパーサ） ---------- */
  function parseJs(src) {
    let i = src.indexOf('[');
    if (i < 0) throw new Error('配列の開始 "[" が見つかりません');

    const fail = msg => { throw new Error(`${msg}（位置 ${i + 1}）`); };
    const skip = () => {
      for (;;) {
        while (i < src.length && /\s/.test(src[i])) i++;
        if (src.startsWith('//', i)) {
          while (i < src.length && src[i] !== '\n') i++;
        } else if (src.startsWith('/*', i)) {
          const e = src.indexOf('*/', i + 2);
          i = e < 0 ? src.length : e + 2;
        } else break;
      }
    };
    const parseString = () => {
      const q = src[i++];
      let out = '';
      const simple = { n: '\n', t: '\t', r: '\r', '0': '\0' };
      while (i < src.length && src[i] !== q) {
        if (src[i] === '\\') {
          i++;
          const e = src[i++];
          const hex = src.substr(i, 4);
          if (e === 'u' && /^[0-9a-fA-F]{4}$/.test(hex)) {
            out += String.fromCharCode(parseInt(hex, 16));
            i += 4;
          } else {
            out += Object.prototype.hasOwnProperty.call(simple, e) ? simple[e] : (e ?? '');
          }
        } else {
          out += src[i++];
        }
      }
      if (i >= src.length) fail('文字列が閉じられていません');
      i++;
      return out;
    };
    const parseValue = () => {
      skip();
      const c = src[i];
      if (c === '[') return parseArray();
      if (c === '"' || c === "'" || c === '`') return parseString();
      const m = /^(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|true|false|null|undefined)/.exec(src.slice(i, i + 64));
      if (!m) fail('値を解釈できません');
      i += m[0].length;
      switch (m[0]) {
        case 'true': return true;
        case 'false': return false;
        case 'null': case 'undefined': return null;
        default: return Number(m[0]);
      }
    };
    const parseArray = () => {
      i++; // [
      const arr = [];
      for (;;) {
        skip();
        if (src[i] === ']') { i++; return arr; }
        arr.push(parseValue());
        skip();
        if (src[i] === ',') { i++; continue; }
        if (src[i] === ']') { i++; return arr; }
        fail('"," または "]" が必要です');
      }
    };

    const data = parseValue();
    if (!Array.isArray(data)) fail('配列ではありません');
    if (data.length === 0) return [];
    // 1次元配列は1行とみなす。要素が配列でなければ1セルの行として扱う
    return data.every(x => !Array.isArray(x)) ? [data] : data.map(x => (Array.isArray(x) ? x : [x]));
  }

  /* ---------- CSV ---------- */
  function detectDelim(src) {
    const line = src.split(/\r?\n/).find(l => l.trim()) || '';
    const cands = [[',', countOf(line, ',')], [';', countOf(line, ';')], ['\t', countOf(line, '\t')]];
    cands.sort((a, b) => b[1] - a[1]);
    return cands[0][1] > 0 ? cands[0][0] : ',';
  }
  function parseCsv(src, delim) {
    const rows = [];
    let row = [], cell = '', quoted = false;
    for (let i = 0; i < src.length; ) {
      const c = src[i];
      if (quoted) {
        if (c === '"') {
          if (src[i + 1] === '"') { cell += '"'; i += 2; continue; }
          quoted = false; i++; continue;
        }
        cell += c; i++; continue;
      }
      if (c === '"' && cell === '') { quoted = true; i++; continue; }
      if (c === delim) { row.push(cell); cell = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
      cell += c; i++;
    }
    if (quoted) throw new Error('CSV: 引用符（"）が閉じられていません');
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => !(r.length === 1 && r[0] === ''));
  }
  function toCsv(rows, delim) {
    const q = v => (v.includes(delim) || /["\r\n]/.test(v) || v !== v.trim())
      ? '"' + v.replace(/"/g, '""') + '"' : v;
    return pad(rows, width(rows)).map(r => r.map(q).join(delim)).join('\n');
  }

  /* ---------- Markdown 表 ---------- */
  function parseMd(src) {
    const rows = [];
    const sepRe = /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?$/;
    for (const raw of src.split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || !line.includes('|')) continue;   // 表以外の行は無視
      if (sepRe.test(line)) continue;               // |---|---| の区切り行
      let body = line;
      if (body.startsWith('|')) body = body.slice(1);
      if (body.endsWith('|') && !body.endsWith('\\|')) body = body.slice(0, -1);
      const cells = [];
      let cell = '';
      for (let k = 0; k < body.length; k++) {
        const c = body[k];
        if (c === '\\' && body[k + 1] === '|') { cell += '|'; k++; }
        else if (c === '|') { cells.push(cell.trim()); cell = ''; }
        else cell += c;
      }
      cells.push(cell.trim());
      rows.push(cells);
    }
    return rows;
  }
  function toMd(rows) {
    if (!rows.length) return '';
    const w = width(rows), n = pad(rows, w);
    const esc = v => v.replace(/\|/g, '\\|').replace(/\r?\n/g, ' <br> ');
    const fmt = r => '| ' + r.map(esc).join(' | ') + ' |';
    return [fmt(n[0]), '| ' + Array(w).fill('---').join(' | ') + ' |', ...n.slice(1).map(fmt)].join('\n');
  }

  /* ---------- TeX tabular ---------- */
  const TEX_MAP = {
    '\\': '\\textbackslash{}', '&': '\\&', '%': '\\%', '$': '\\$', '#': '\\#',
    '_': '\\_', '{': '\\{', '}': '\\}', '~': '\\textasciitilde{}', '^': '\\textasciicircum{}'
  };
  const escTex = s => s.replace(/\r?\n/g, ' ').replace(/[\\&%$#_{}~^]/g, c => TEX_MAP[c]);
  const unescapeTex = s => s
    .replace(/\\textbackslash\{\}/g, '\\')
    .replace(/\\textasciitilde\{\}/g, '~')
    .replace(/\\textasciicircum\{\}/g, '^')
    .replace(/\\([&%$#_{}])/g, '$1');

  const skipWs = (s, p) => { while (p < s.length && /\s/.test(s[p])) p++; return p; };
  function readGroup(s, p) {
    if (s[p] !== '{') throw new Error('TeX: "{" が必要です');
    let depth = 0;
    for (let k = p; k < s.length; k++) {
      if (s[k] === '\\') { k++; continue; }
      if (s[k] === '{') depth++;
      else if (s[k] === '}') {
        depth--;
        if (depth === 0) return { content: s.slice(p + 1, k), end: k + 1 };
      }
    }
    throw new Error('TeX: "}" が閉じられていません');
  }
  function parseTex(src) {
    const text = src.split(/\r?\n/).filter(l => !l.trimStart().startsWith('%')).join('\n');
    const bm = /\\begin\{tabular(\*)?\}/.exec(text);
    if (!bm) throw new Error('\\begin{tabular} が見つかりません');
    let p = skipWs(text, bm.index + bm[0].length);
    if (bm[1]) p = skipWs(text, readGroup(text, p).end);       // tabular* の幅
    if (text[p] === '[') {                                    // [t] などの位置指定
      const e = text.indexOf(']', p);
      if (e < 0) throw new Error('TeX: "]" が閉じられていません');
      p = skipWs(text, e + 1);
    }
    p = readGroup(text, p).end;                               // 列指定 {lll}
    const endIdx = text.indexOf('\\end{tabular', p);
    const body = text.slice(p, endIdx < 0 ? text.length : endIdx);

    return body.split(/\\\\(?:\s*\[[^\]]*\])?/)
      .map(s => s
        .replace(/\\(?:hline|toprule|midrule|bottomrule|hrule)(?![a-zA-Z])/g, '')
        .replace(/\\cline\s*\{[^}]*\}/g, '')
        .trim())
      .filter(s => s !== '')
      .map(s => s.split(/(?<!\\)&/).map(c => unescapeTex(c.trim())));
  }
  function toTex(rows, { align, vrule, hrule }) {
    if (!rows.length) return '';
    const w = width(rows), n = pad(rows, w);
    const spec = vrule
      ? '|' + Array(w).fill(align + '|').join('')
      : Array(w).fill(align).join('');
    const out = [`\\begin{tabular}{${spec}}`, '\\hline'];
    n.forEach((r, i) => {
      out.push(r.map(escTex).join(' & ') + ' \\\\');
      if (hrule || i === n.length - 1) out.push('\\hline');
    });
    out.push('\\end{tabular}');
    return out.join('\n');
  }

  /* ---------- JS 出力 ---------- */
  function toJs(rows, numeric) {
    if (!rows.length) return '[]';
    const q = v => (numeric && /^-?\d+(\.\d+)?$/.test(v) ? v : JSON.stringify(v));
    return '[\n' + pad(rows, width(rows)).map(r => '  [' + r.map(q).join(', ') + ']').join(',\n') + '\n]';
  }

  /* ---------- 入出力の振り分け ---------- */
  function readIn(src) {
    switch (inFmt.value) {
      case 'js': return parseJs(src);
      case 'csv': {
        const v = $('csvDelim').value;
        return parseCsv(src, v === 'auto' ? detectDelim(src) : DELIMS[v]);
      }
      case 'md': return parseMd(src);
      case 'tex': return parseTex(src);
    }
    return [];
  }
  function writeOut(rows, fmt = outFmt.value) {
    switch (fmt) {
      case 'js': return toJs(rows, $('jsNumeric').checked);
      case 'csv': {
        const v = $('csvDelim').value;
        return toCsv(rows, v === 'auto' ? ',' : DELIMS[v]);
      }
      case 'md': return toMd(rows);
      case 'tex': return toTex(rows, {
        align: $('texAlign').value,
        vrule: $('texVRule').checked,
        hrule: $('texHRule').checked
      });
    }
    return '';
  }

  /* ---------- 画面処理 ---------- */
  function setStatus(msg, cls = '') {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + cls;
  }
  function renderPreview(rows) {
    previewEl.textContent = '';
    if (!rows.length) return;
    const w = width(rows), table = document.createElement('table');
    pad(rows, w).forEach((r, i) => {
      const tr = document.createElement('tr');
      r.forEach(v => {
        const cell = document.createElement(i === 0 ? 'th' : 'td');
        cell.textContent = v;
        tr.appendChild(cell);
      });
      table.appendChild(tr);
    });
    previewEl.appendChild(table);
  }
  function convert() {
    const src = inputEl.value;
    if (!src.trim()) {
      outputEl.value = '';
      previewEl.textContent = '';
      setStatus('入力待ち');
      return;
    }
    try {
      const rows = readIn(src).map(r => r.map(cellToStr));
      outputEl.value = writeOut(rows);
      renderPreview(rows);
      setStatus(`${rows.length} 行 × ${width(rows)} 列を変換しました`, 'ok');
    } catch (e) {
      outputEl.value = '';
      previewEl.textContent = '';
      setStatus('エラー: ' + e.message, 'err');
    }
  }

  const SAMPLE = [
    ['名前', '点数', '備考'],
    ['Alice', '92', 'A & B'],
    ['Bob', '78', '100% 完了'],
    ['Carol', '85', 'a|b, c'],
    ['Dave', '', '_x_ {y} $z$']
  ];

  $('swapBtn').addEventListener('click', () => {
    if (!outputEl.value) return;
    const newIn = outFmt.value;
    outFmt.value = inFmt.value;
    inFmt.value = newIn;
    inputEl.value = outputEl.value;
    convert();
  });
  $('sampleBtn').addEventListener('click', () => {
    inputEl.value = writeOut(SAMPLE, inFmt.value);
    convert();
  });
  $('clearBtn').addEventListener('click', () => {
    inputEl.value = '';
    convert();
    inputEl.focus();
  });
  $('copyBtn').addEventListener('click', async () => {
    if (!outputEl.value) return;
    try {
      await navigator.clipboard.writeText(outputEl.value);
    } catch {
      outputEl.select();
      document.execCommand('copy');
    }
    setStatus('出力をコピーしました', 'ok');
  });

  inputEl.addEventListener('input', convert);
  [inFmt, outFmt, $('csvDelim'), $('jsNumeric'), $('texAlign'), $('texVRule'), $('texHRule')]
    .forEach(el => el.addEventListener('change', convert));

  inputEl.value = writeOut(SAMPLE, 'js');
  convert();
})();
</script>
</body>
</html>
